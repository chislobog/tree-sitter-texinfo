[package]
name = "tree-sitter-texinfo"
description = "Texinfo grammar for tree-sitter"
version = "0.3.0"
authors = ["Janko Lisica <janko.lisica@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "texinfo"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/chislobog/tree-sitter-texinfo"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*.c",
  "src/*.json",
  "src/tree_sitter/*.h",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
