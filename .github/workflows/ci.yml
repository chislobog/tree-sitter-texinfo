name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Warns when the parser's state count grows by 10%, fails at 50%.
      - name: Parser size
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE" || true
          script/check-parser-size.sh "$BASE"

      - uses: cachix/install-nix-action@v31

      # The dev shell provides the same tools as locally, and links the
      # example manuals and texi2any's test inputs into the checkout.
      - name: Build the dev shell
        run: nix develop --command true

      - name: Generated parser is up to date
        run: |
          nix develop --command tree-sitter generate
          git diff --exit-code src/

      - name: Tests
        run: nix develop --command tree-sitter test

      # ESLint, clang-format, ruff, shellcheck, nixfmt, and ts_query_ls, which
      # checks that the queries' node and field names exist in the grammar.
      - name: Lint
        run: nix develop --command script/lint.sh

      - name: Incremental parsing
        run: nix develop --command tree-sitter fuzz --iterations 100

      # gawk's Italian manual has a footnote crossing a conditional, which a
      # tree-sitter parse can't represent (see TODO.md).
      - name: Parse the example manuals
        run: |
          nix develop --command bash -c "
            find -L examples -name '*.texi' ! -path '*/it/gawk.texi' -print0 |
              xargs -0 tree-sitter parse --quiet --stat"

      # Without the files texi2any itself fails on, and those listed as noise
      # in CLAUDE.md.
      - name: Compare with texi2any on the manuals
        run: |
          nix develop --command bash -c "
            find -L examples -name '*.texi' ! -path '*/it/*' \
                ! -name texinfo-tex-test.texi ! -name html_default_commands_args.texi |
              sort | xargs python3 script/compare-texi2any.py --hunks 3 --fail-under 99.99"

      - name: Compare with texi2any on its test inputs
        run: |
          nix develop --command bash -c "
            set -o pipefail
            find -L texinfo-tests -name '*.texi' | sort |
              xargs python3 script/compare-texi2any.py --hunks 0 --fail-under 98.6 |
              tail -1"

  # libFuzzer with address and undefined-behaviour sanitizers, looking for
  # crashes and memory errors in the scanner. Seeded with the corpus test
  # inputs, so the fuzzer starts from blocks, raw text, menus and sections.
  fuzz:
    name: Fuzz the scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Seed corpus
        run: python3 script/corpus-inputs.py fuzz-seeds

      - uses: tree-sitter/fuzz-action@v4
        with:
          corpus: fuzz-seeds
          max-time: "120"
          tree-sitter-version: v0.26.11

  # The scanner is compiled on users' machines by every editor, including
  # with MSVC on Windows; the bindings are how most projects use the grammar.
  platforms:
    name: Tests and bindings on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.26.11

      - uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
