name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels a run in progress, except on main,
# where every commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Branches in this repository are checked on push; pull requests only
    # from forks, to avoid running twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7

      # Warns when the parser's state count grows by 10%, fails at 50%.
      - name: Parser size
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE" || true
          script/check-parser-size.sh "$BASE"

      - uses: cachix/install-nix-action@v31

      # The dev shell provides the same tools as locally, and links the
      # example manuals and texi2any's test inputs into the checkout.
      - name: Build the dev shell
        run: nix develop --command true

      - name: Generated parser is up to date
        run: |
          nix develop --command tree-sitter generate
          git diff --exit-code src/

      - name: Tests
        run: nix develop --command tree-sitter test

      # ESLint, clang-format, ruff, shellcheck, nixfmt, and ts_query_ls, which
      # checks that the queries' node and field names exist in the grammar.
      - name: Lint
        run: nix develop --command script/lint.sh

      - name: Incremental parsing
        run: nix develop --command tree-sitter fuzz --iterations 100

      # Each check below must still fail on inputs it is meant to catch
      # (test/checks/), and pass on the others.
      - name: The checks catch what they should
        run: nix develop --command python3 script/test-checks.py

      # Only the manuals listed in test/parse-errors.txt, with the errors in
      # their source, may fail to parse, and none may parse ten times slower
      # than the median (script/parse-examples.py).
      - name: Parse the example manuals
        run: |
          nix develop --command bash -c "
            find -L examples \( -name '*.texi' -o -name '*.texinfo' -o -name '*.txi' \) | sort |
              python3 script/parse-examples.py"

      # Without the files texi2any itself fails on, and a fragment for
      # @include. Any difference not listed in test/texi2any-differences.txt
      # with its reason fails, as does a listed one no longer found.
      - name: Compare with texi2any on the manuals
        run: |
          nix develop --command bash -c "
            find -L examples \( -name '*.texi' -o -name '*.texinfo' -o -name '*.txi' \) ! -path '*/it/*' \
                ! -name texinfo-tex-test.texi ! -name html_default_commands_args.texi |
              sort | python3 script/compare-texi2any.py --hunks 0 \
                --expected test/texi2any-differences.txt"

      - name: Compare with texi2any on its test inputs
        run: |
          nix develop --command bash -c "
            set -o pipefail
            find -L texinfo-tests -name '*.texi' | sort |
              python3 script/compare-texi2any.py --hunks 0 \
                --expected test/texi2any-differences.txt | tail -1"

      # Any change to a tree, in any manual or test input, must be deliberate
      # and recorded with `script/tree-snapshots.py --write`.
      - name: Tree snapshots
        run: |
          nix develop --command bash -c "
            find -L examples texinfo-tests \( -name '*.texi' -o -name '*.texinfo' -o -name '*.txi' \) | sort |
              python3 script/tree-snapshots.py --check"

      # texi2any's 1,700 small, often invalid test inputs and the manuals, as
      # a corpus that exists only here (their licences differ from this
      # repository's), so `tree-sitter fuzz` checks incremental parsing on
      # them after random edits anywhere. The test first checks that each
      # input was written whole. Each run has a random seed, which the
      # fuzzer prints.
      - name: Fuzz texi2any's test inputs and the manuals
        run: |
          nix develop --command bash -c "
            set -e -o pipefail
            { find -L texinfo-tests -name '*.texi'
              find -L examples \( -name '*.texi' -o -name '*.texinfo' -o -name '*.txi' \); } |
              sort | python3 script/fuzz-corpus.py
            tree-sitter test --file-name fuzz-inputs.txt > /dev/null
            tree-sitter fuzz --include texinfo-tests --iterations 50
            tree-sitter fuzz --include examples --iterations 10
            rm test/corpus/fuzz-inputs.txt"

      # Typing mistakes in the manuals: each must stay local, and an edited
      # tree must equal a fresh parse. A fixed seed, so a failure reproduces.
      - name: Editing simulation
        run: |
          nix develop --command bash -c "
            find -L examples \( -name '*.texi' -o -name '*.texinfo' -o -name '*.txi' \) ! -path '*/it/*' | sort |
              python3 script/check-edits.py --edits 5 --seed 0"

  # libFuzzer with address and undefined-behaviour sanitizers, looking for
  # crashes and memory errors in the scanner. Seeded with the corpus test
  # inputs, so the fuzzer starts from blocks, raw text, menus and sections.
  fuzz:
    name: Fuzz the scanner
    runs-on: ubuntu-latest
    # Branches in this repository are checked on push; pull requests only
    # from forks, to avoid running twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Seed corpus
        run: python3 script/corpus-inputs.py fuzz-seeds

      - uses: tree-sitter/fuzz-action@v4
        with:
          corpus: fuzz-seeds
          max-time: "120"
          tree-sitter-version: v0.26.11

  # The scanner is compiled on users' machines by every editor, including
  # with MSVC on Windows; the bindings are how most projects use the grammar.
  platforms:
    name: Tests and bindings on ${{ matrix.os }}
    # Branches in this repository are checked on push; pull requests only
    # from forks, to avoid running twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.26.11

      - uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
