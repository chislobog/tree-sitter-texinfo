name: CI

# Changes to the documentation alone aren't checked (`nix flake check` runs
# the same checks locally before pushing), nor tags, whose commit a branch
# has had checked.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels a run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Runs take 10 to 15 minutes with the Nix store of an earlier run.
    timeout-minutes: 90
    # Purging the caches of earlier runs deletes them through the API. A
    # pull request from a fork gets a read-only token anyway.
    permissions:
      contents: read
      actions: write
    # Branches in this repository are checked on push; pull requests only
    # from forks, to avoid running twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      # Actions are pinned to a commit, which Dependabot updates
      # (.github/dependabot.yml): a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # The Nix store from the last run, so the checks whose inputs didn't
      # change aren't built again. Keyed by those inputs, so a run that
      # changes them saves its own; only the newest is kept.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'grammar.js', 'tree-sitter.json', '.tsqueryrc.json', 'src/**', 'script/**', 'test/**', 'queries/**', 'editors/**', 'eslint.config.mjs', 'package-lock.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Every check in flake.nix: the formatting and the linters
      # (pre-commit), the tests, the parser's size, fuzzing (tree-sitter's
      # and libFuzzer's on the scanner), the manuals, the texi2any
      # comparisons, the snapshots and the editing simulation.
      - name: Checks
        run: nix flake check -L

      # The cache action collects garbage before saving the store, which
      # took every check's result, built without a root, and the tools:
      # the next run built them all again. Their roots keep them.
      - name: Keep the checks' results and tools
        run: |
          nix build .#checks --out-link .gcroots/checks
          nix develop --profile .gcroots/dev --command true

      # The other systems' checks, which no runner builds, must evaluate.
      - name: Evaluate every system's checks
        run: nix flake check --all-systems --no-build

  # The scanner is compiled on users' machines by every editor, including
  # with MSVC on Windows, and the bindings are how most projects use the
  # grammar. On Linux, `nix flake check` already generates and tests the
  # parser.
  bindings:
    name: Bindings on ${{ matrix.os }}
    # Branches in this repository are checked on push; pull requests only
    # from forks, to avoid running twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version nixpkgs has (`tree-sitter --version` in the dev shell).
      - uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          tree-sitter-ref: v0.26.11

      - uses: tree-sitter/parser-test-action@05f6ce7c7e54603c45cd87ed926725dc870bcc63 # v3
        with:
          generate: false
          test-parser: ${{ matrix.os != 'ubuntu-latest' }}
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          # go.mod's version, which go-tree-sitter 0.25 requires.
          go-version: "1.23"
          # XCTest comes with Xcode, which only the macOS runner has. The
          # action's default Swift, 6.1, can't build the modules of the
          # runner's newer macOS SDK.
          test-swift: ${{ matrix.os == 'macos-latest' }}
          swift-version: latest
