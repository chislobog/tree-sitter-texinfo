name: Platforms

# The scanner is compiled on users' machines by every editor, including with
# MSVC on Windows, and the bindings are how most projects use the grammar.
# Built on macOS and Windows weekly, on release tags and on demand (Actions >
# Platforms > Run workflow) rather than on every push: their minutes count
# ten and two times on a private repository. ci.yml builds them on Linux.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bindings:
    name: Tests and bindings on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.26.11

      - uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
