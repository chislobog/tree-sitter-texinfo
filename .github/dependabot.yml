# Keeps the commits that the workflows pin their actions to up to date, and
# the ESLint of package-lock.json, which the pre-commit hook runs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # eslint-config-treesitter 1.0.2, the last (2024), doesn't work with
      # ESLint 10: its eslint-plugin-jsdoc allows ESLint 9 at most, and it
      # imports `globals`, which only ESLint 9 brings.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # The CLI is nixpkgs' (flake.nix) and CI's pinned one, which move
      # together, with `src/` generated again.
      - dependency-name: tree-sitter-cli
